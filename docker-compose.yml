version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5100:5100"
    volumes:
      - db-data:/app
    environment:
      - DATABASE_URL=sqlite:///dlscm.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3100:3100"
    depends_on:
      - backend

volumes:
  db-data:
